[tool.poetry]
name = "nonebot-plugin-keyreply"
version = "0.1.0"
description = "根据设定好的关键词进行自动回复词条的插件"
authors = ["yuyue <yuyue@example.com>"]
readme = "README.md"
homepage = "https://github.com/yuyue/nonebot-plugin-keyreply"
repository = "https://github.com/yuyue/nonebot-plugin-keyreply"
keywords = ["nonebot", "nonebot2", "keyreply", "reply"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [
    { include = "nonebot_plugin_keyreply" }
]

[tool.poetry.dependencies]
python = "^3.9"
nonebot2 = "^2.2.0"
nonebot-adapter-onebot = "^2.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
