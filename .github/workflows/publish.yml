name: Publish to PyPI

on:
  push:
    branches:
      - "main"
      - "master"
    paths:
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      force:
        description: "Force publish"
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 获取上一次提交以进行版本对比

      - name: Check Version Change
        id: check_version
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Force publish requested."
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            PREV_VERSION=$(git show HEAD~1:pyproject.toml | python -c "import re, sys; m=re.search(r'version\s*=\s*\"([^\"]+)\"', sys.stdin.read()); print(m.group(1))" || echo "")
            CURR_VERSION=$(python -c "import re; m=re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()); print(m.group(1))")
            echo "Previous version: $PREV_VERSION"
            echo "Current version: $CURR_VERSION"
            
            if [ "$PREV_VERSION" = "$CURR_VERSION" ] || [ -z "$CURR_VERSION" ]; then
              echo "Version has not changed. Skipping publish."
              echo "changed=false" >> $GITHUB_OUTPUT
            else
              echo "Version changed from $PREV_VERSION to $CURR_VERSION. Proceeding with publish."
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "No previous commit to compare. Proceeding."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check_version.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        if: steps.check_version.outputs.changed == 'true'
        run: |
          curl -sSL https://install.python-poetry.org | python3 -

      - name: Install Dependencies
        if: steps.check_version.outputs.changed == 'true'
        run: poetry install --no-interaction

      - name: Build Package
        if: steps.check_version.outputs.changed == 'true'
        run: poetry build

      - name: Publish Package to PyPI
        if: steps.check_version.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
